language: en-US
tone_instructions: Direct and specific. Point to the file and line, say what breaks for a person using Standcast, and suggest the fix. Skip praise and style nits that Biome already enforces.
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - dev
      - main
    labels:
      - "!promotion"
      - "!autorelease: pending"
  path_filters:
    - "!bun.lock"
    - "!CHANGELOG.md"
    - "!docs/superpowers/**"
    - "!packages/db/migrations/meta/**"
  path_instructions:
    - path: "**/*.{ts,tsx,css,sh,yml,yaml}"
      instructions: |
        Review against docs/engineering/review-guide.md. In particular flag:
        - any comment added to code (the project allows none);
        - business rules, database queries or external API calls inside routes, jobs, the CLI or the MCP server instead of a use case;
        - a database query not scoped by installation_id (and member_id for personal data);
        - logging outside logError, or logs containing tokens, emails, daily or card text, request bodies or SQL params;
        - user-visible text not going through t(lang, key) with both pt-BR and en keys;
        - suggestions, card activity or per-person signals reaching managers, /v1/org, /v1/manage, webhooks, the digest, the setup page or logs;
        - a Slack message sent without claimDelivery, or work after the claim outside the try;
        - a queue.enqueue whose policy differs from the queue.work declaration of the same job;
        - read-then-write races without compare-and-swap or an advisory lock;
        - HTTP calls without a timeout, single-page reads of paginated APIs, network calls while a database transaction is open;
        - state resolved or deleted after an external source failed;
        - regexes that can backtrack on user input, GraphQL inputs not passed as variables, redirects built from request data;
        - imports of packages not declared in the package's own package.json;
        - dead code, duplicated helpers and tests that would pass without the feature.
        Then hunt for logic errors, following the "Logic and failure modes" section of the review guide. Trace at least one concrete input through each changed branch and report only what you can show breaking:
        - off-by-one and boundary mistakes: < against <=, empty lists, one item, exactly the cap, one past the cap, the first and last day of a window;
        - inverted or wrong conditions, && where || was meant, early returns that skip work the caller relies on;
        - || used where ?? was meant, and optional fields that rows written before a migration do not have;
        - async calls without await, array.forEach(async ...), and Promise.all over independent items that leaves partial state on the first failure;
        - catch blocks that return a default and hide the failure;
        - values copied from an external source (emails, team membership, identities, tokens) with no refresh or expiry;
        - lookups across installations that do not pick nobody on more than one match;
        - values derived from "the person's team" taken from another installation than the one the data belongs to;
        - permanent errors (no linked identity, not found, revoked token, invalid config) retried as if they were transient;
        - scheduled jobs that skip sending without recording why;
        - new config keys, settings or column defaults that change behaviour for existing installations;
        - behaviour claimed in the pull request description with no code path or no test.
    - path: "packages/db/migrations/**/*.sql"
      instructions: |
        The API runs migrations on start while the previous worker may still be running, so a migration must work with both releases. Flag renames or drops of columns the previous release still uses, new NOT NULL columns without a default, unique indexes or constraints that existing rows may break, and backfills mixed into schema changes. Check that the schema in packages/db/src/schema.ts and the generated snapshot match the SQL.
    - path: "**/package.json"
      instructions: |
        For dependency changes, read the release notes of every version skipped and point out breaking changes or fixes that matter to Standcast. Prefer the latest patch of the target minor. Flag a new runtime dependency that duplicates one already in the workspace, and a package added to the wrong workspace package.
    - path: "**/*.test.{ts,tsx}"
      instructions: |
        Flag tests that depend on timing: a worker started before the state it reads, fixed sleeps, or assertions on counts that a second poll can change. Flag tests that would still pass with the feature removed, and missing cases for the boundaries the change introduces.
    - path: "apps/*/src/env.ts"
      instructions: |
        A new required environment variable makes the service fail at boot until it is set in Railway. Prefer an optional variable with a safe default. Otherwise the pull request must list it under deploy notes and docs/site must document it.
    - path: "packages/orchestrator/src/modules/**"
      instructions: |
        Use cases hold the business rules and throw DomainError with a stable code. Check idempotency on retries, concurrency between two workers, tenant scoping and the anti-surveillance rule. Every new behaviour needs a use-case test without HTTP.
    - path: "apps/api/src/{web/**,routes/web.tsx}"
      instructions: |
        Server-rendered pages under a strict CSP: no style attributes, no script tags, styles only from classes in styles.ts. State-changing forms carry the CSRF field. Check en and pt-BR, dark mode tokens, visible keyboard focus, 44px touch targets on phones and that long values wrap.
    - path: "apps/api/src/routes/**"
      instructions: |
        Routes stay thin: parse, call one use case, map the result. Internal agent routes must stay out of the public OpenAPI document. Redirect targets come only from configured URLs.
    - path: "packages/adapters/**"
      instructions: |
        Adapters for GitHub, Slack and Linear. External input is untrusted. Every HTTP call has a timeout, paginated endpoints are read up to a cap, errors map to typed errors and never include tokens. Check the provider's documented meaning of each error code.
    - path: "packages/db/**"
      instructions: |
        Repository functions must be scoped by installation_id. Writes that can race use compare-and-swap or a transaction-scoped advisory lock. New tables go into the truncate list in packages/db/test/setup.ts and come with a generated migration.
    - path: "packages/core/**"
      instructions: |
        Pure functions only: no I/O, no Date.now(), time comes in as a parameter. Watch time zones, workday rules and exact thresholds.
    - path: "docs/site/**/*.md"
      instructions: |
        Documentation in en (docs/site) and pt-BR (docs/site/pt-BR) must stay in sync and match the code. Nothing may describe managers or the organization seeing a person's suggestions or card activity. Product changes and public API changes are separate changelog bullets. A feat, fix, perf or refactor a person can see needs a new bullet under Unreleased in docs/site/changelog.md and under Não lançado in docs/site/pt-BR/changelog.md. A public API contract change needs its own bullet under Unreleased in docs/api/CHANGELOG.md, not in the product changelog.
    - path: ".github/workflows/**"
      instructions: |
        Actions must be pinned to full commit SHAs and job permissions kept minimal. No YAML comments.
  pre_merge_checks:
    docstrings:
      mode: "off"
    custom_checks:
      - name: No comments in code
        mode: warning
        instructions: Fail if the pull request adds comments to TypeScript, TSX, CSS, shell, YAML or Dockerfile files. Markdown is allowed.
      - name: Tenant scoping
        mode: warning
        instructions: Fail if a new or changed database query reads or writes rows without filtering by installation_id.
      - name: Anti-surveillance
        mode: error
        instructions: Fail if suggestions, Linear card activity or per-person signals can reach the digest, /v1/org, /v1/manage, outgoing webhooks, the setup page or logs, or if the change adds per-person metrics or rankings.
      - name: Both languages
        mode: warning
        instructions: Fail if user-visible text is added without both pt-BR and en i18n keys, or if docs/site changes in one language only.
      - name: Release changelog
        mode: warning
        instructions: Product and API notes are separate. Fail if a feat, fix, perf or refactor a person can see has no new bullet under Unreleased in docs/site/changelog.md and the same news under Não lançado in docs/site/pt-BR/changelog.md. Fail if a public API contract change (paths, fields, status codes, scopes, webhook payloads) has no new bullet under Unreleased in docs/api/CHANGELOG.md. Do not accept an API contract note in the product changelog, or a product note in the API changelog. docs, chore, ci and test commits need neither.
  tools:
    biome:
      enabled: true
    gitleaks:
      enabled: true
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: false
knowledge_base:
  learnings:
    scope: local
  code_guidelines:
    enabled: true
    filePatterns:
      - files: docs/engineering/review-guide.md
        applyTo: "**"
      - files: CONTRIBUTING.md
        applyTo: "**"
chat:
  auto_reply: true
