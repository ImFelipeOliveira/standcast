name: promote-dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: promote-dev
  cancel-in-progress: true

permissions: {}

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: create-github-app-token v3.3.0
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
      - name: Open or update the dev to main pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ahead=$(gh api "repos/$GH_REPO/compare/main...dev" --jq .ahead_by)
          if [ "$ahead" = "0" ]; then
            echo "main already contains dev"
            exit 0
          fi
          since=$(gh pr list --base main --head dev --state merged --limit 1 --json mergedAt --jq '.[0].mergedAt // empty')
          search="is:merged"
          if [ -n "$since" ]; then
            search="is:merged merged:>$since"
          fi
          limit=1000
          gh pr list --base dev --state merged --limit "$limit" --search "$search" \
            --json number,title,headRefName > merged.json
          fetched=$(jq length merged.json)
          list=$(jq -r '[.[] | select(.headRefName != "main")] | sort_by(.number) | .[] | "- #\(.number) \(.title)"' merged.json)
          if [ -z "$list" ]; then
            list="- No merged pull requests found since the last promotion."
          fi
          if [ "$fetched" -ge "$limit" ]; then
            query=$(jq -rn --arg q "is:pr base:dev $search" '$q | @uri')
            list="$list
          - The list stops at $limit pull requests. See the full list: https://github.com/$GH_REPO/pulls?q=$query"
          fi
          start="<!-- promote-dev:start -->"
          end="<!-- promote-dev:end -->"
          printf '%s\n## Pull requests in this promotion\n\n%s\n%s\n' "$start" "$list" "$end" > managed.md
          pr=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            {
              cat managed.md
              printf '\n## Deploy notes\n\n- None yet.\n'
            } > body.md
            gh pr create --base main --head dev --title "chore: promote dev to main" --body-file body.md
            exit 0
          fi
          gh pr view "$pr" --json body --jq .body | tr -d '\r' > current.md
          markers=$(awk -v start="$start" -v end="$end" '
            $0 == start { s++; if (!sl) sl = NR }
            $0 == end { e++; if (!el) el = NR }
            END {
              if (s == 0 && e == 0) print "none";
              else if (s == 1 && e == 1 && sl < el) print "ok";
              else print "invalid";
            }
          ' current.md)
          case "$markers" in
            ok)
              awk -v start="$start" -v end="$end" -v managed="managed.md" '
                $0 == start { while ((getline line < managed) > 0) print line; skip = 1; next }
                $0 == end { skip = 0; next }
                !skip { print }
              ' current.md > body.md
              ;;
            none)
              {
                cat managed.md
                printf '\n'
                cat current.md
              } > body.md
              ;;
            *)
              echo "::warning::the promotion pull request has broken promote-dev markers; its body was left unchanged"
              exit 0
              ;;
          esac
          gh pr edit "$pr" --body-file body.md
