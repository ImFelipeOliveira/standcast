name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload the CLI binaries for (standcast-vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: create-github-app-token v3.3.0
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
      - name: release-please v5.0.0
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-changelogs:
    needs: release-please
    if: needs.release-please.outputs.pr != '' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: create-github-app-token v3.3.0
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
      - name: checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ steps.app.outputs.token }}
      - name: setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Move unreleased entries under the release version
        run: bun scripts/release-changelogs.ts
      - name: Commit the changelog headings
        env:
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "standcast-release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release changelog headings"
          git push origin "HEAD:$BRANCH"

  cli-assets:
    needs: release-please
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Check the release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^standcast-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like standcast-vX.Y.Z"
            exit 1
          fi
          if ! gh release view "$TAG_NAME" --json tagName > /dev/null; then
            echo "::error::no release found for $TAG_NAME"
            exit 1
          fi
      - name: checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          persist-credentials: false
      - name: setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Warn when CLI is absent
        if: hashFiles('apps/cli/src/main.ts') == ''
        run: echo "::warning::CLI not present, no binaries attached"
      - name: Build CLI binaries
        if: hashFiles('apps/cli/src/main.ts') != ''
        env:
          STANDCAST_DEFAULT_API_URL: https://api.standcast.app
        run: bun run build:cli
      - name: Upload CLI binaries
        if: hashFiles('apps/cli/src/main.ts') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG_NAME" dist/standcast-* dist/SHA256SUMS --clobber

  npm-publish:
    needs: [release-please, cli-assets]
    if: ${{ !cancelled() && needs.cli-assets.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Check the npm token
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set, so neither npm nor the MCP registry got this release"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: checkout v7.0.1
        if: steps.npm.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: setup-bun v2.2.0
        if: steps.npm.outputs.ready == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: setup-node v7.1.0
        if: steps.npm.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Download and check the CLI binaries
        if: steps.npm.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG_NAME" -p 'standcast-bun-*' -p SHA256SUMS -D dist --clobber
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Build the npm packages
        if: steps.npm.outputs.ready == 'true'
        run: bun scripts/npm-packages.ts "${TAG_NAME#standcast-v}" dist dist/npm > dist/npm-order.txt
      - name: Publish the npm packages
        if: steps.npm.outputs.ready == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          while read -r dir; do
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            latest=$(npm view "$name" dist-tags.latest 2> /dev/null || true)
            tag=latest
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)" != "$version" ]; then
              tag=backport
              echo "$name@$version is older than latest $latest, publishing it under the backport tag"
            fi
            npm publish "$dir" --access public --provenance --tag "$tag"
          done < dist/npm-order.txt
      - name: Publish to the MCP registry
        if: steps.npm.outputs.ready == 'true'
        run: |
          version="${TAG_NAME#standcast-v}"
          for _ in $(seq 1 12); do
            if [ "$(npm view "standcast@$version" mcpName 2> /dev/null)" != "" ]; then break; fi
            sleep 10
          done
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz
          echo "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.next.json
          mv server.next.json server.json
          name=$(jq -r .name server.json)
          url="https://registry.modelcontextprotocol.io/v0.1/servers/$(jq -rn --arg n "$name" '$n | @uri')/versions/$version"
          status=$(curl -sS -o registry.json -w '%{http_code}' "$url")
          if [ "$status" = 200 ]; then
            packages='[.packages[] | {registryType, identifier, version}]'
            if [ "$(jq -c ".server | $packages" registry.json)" = "$(jq -c "$packages" server.json)" ]; then
              echo "$name $version is already in the MCP registry"
              exit 0
            fi
            echo "::error::$name $version is in the MCP registry with different packages"
            exit 1
          fi
          if [ "$status" != 404 ]; then
            echo "::error::the MCP registry answered $status for $name $version"
            exit 1
          fi
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
