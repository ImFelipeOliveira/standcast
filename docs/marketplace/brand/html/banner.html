<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card banner</title>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}
</style>
</head>
<body>
<div role="img" aria-label="Standcast" style="position: relative; width: 220px; height: 140px; overflow: hidden; background: #3B4BC8; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="220" height="140" style="position: absolute; inset: 0">
<defs>
<pattern id="gw-dot" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="3" y="3" width="2" height="2" fill="#FFFFFF" fill-opacity="0.14"></rect></pattern>
<pattern id="gw-lit" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="6" height="6" rx="1" fill="#FFFFFF" fill-opacity="0.22"></rect></pattern>
</defs>
<rect width="220" height="140" fill="url(#gw-dot)"></rect>
<rect x="168" y="96" width="16" height="44" fill="url(#gw-lit)"></rect>
<rect x="188" y="80" width="16" height="60" fill="url(#gw-lit)"></rect>
<rect x="16" y="112" width="8" height="8" fill="url(#gw-lit)"></rect>
</svg>
<span style="position: relative; display: flex; align-items: center; gap: 9px">
<svg aria-hidden="true" width="30" height="27" viewBox="0 0 44 40"><rect x="0" y="20" width="11" height="20" rx="1.5" fill="#FFFFFF"></rect><rect x="16" y="10" width="11" height="30" rx="1.5" fill="#FFFFFF"></rect><rect x="32" y="0" width="11" height="40" rx="1.5" fill="#FFFFFF"></rect></svg>
<span style="font-family: Saira, sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.01em">Standcast</span>
</span>
</div>
</body>
</html>
