<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Docs OG image template</title>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
</style>
</head>
<body>
<div style="position: relative; width: 1200px; height: 630px; overflow: hidden; background: #18181B; color: #FFFFFF; font-family: Inter, system-ui, sans-serif">
<svg aria-hidden="true" width="1200" height="630" style="position: absolute; inset: 0">
<defs>
<pattern id="od-dot" width="14" height="14" patternUnits="userSpaceOnUse"><rect x="5" y="5" width="4" height="4" fill="#FFFFFF" fill-opacity="0.06"></rect></pattern>
<pattern id="od-lit" width="14" height="14" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="12" height="12" rx="1.5" fill="#8E9AF5" fill-opacity="0.6"></rect></pattern>
<pattern id="od-mid" width="14" height="14" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="12" height="12" rx="1.5" fill="#8E9AF5" fill-opacity="0.18"></rect></pattern>
</defs>
<rect width="1200" height="630" fill="url(#od-dot)"></rect>
<rect x="980" y="434" width="42" height="196" fill="url(#od-mid)"></rect>
<rect x="980" y="490" width="42" height="140" fill="url(#od-lit)"></rect>
<rect x="1036" y="350" width="42" height="280" fill="url(#od-mid)"></rect>
<rect x="1036" y="406" width="42" height="224" fill="url(#od-lit)"></rect>
<rect x="1092" y="266" width="42" height="364" fill="url(#od-mid)"></rect>
<rect x="1092" y="322" width="42" height="308" fill="url(#od-lit)"></rect>
</svg>
<div style="position: absolute; left: 80px; top: 80px; right: 300px; bottom: 80px; display: flex; flex-direction: column; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 14px">
<svg aria-hidden="true" width="30" height="27" viewBox="0 0 44 40"><rect x="0" y="20" width="11" height="20" rx="1.5" fill="#8E9AF5"></rect><rect x="16" y="10" width="11" height="30" rx="1.5" fill="#8E9AF5"></rect><rect x="32" y="0" width="11" height="40" rx="1.5" fill="#8E9AF5"></rect></svg>
<span style="font-family: Saira, Inter, sans-serif; font-weight: 700; font-size: 26px">Standcast</span>
<span data-slot="section" class="mono" style="font-size: 16px; color: #18181B; background: #8E9AF5; padding: 4px 10px; border-radius: 6px; letter-spacing: .04em">ADMIN</span>
</span>
<h1 data-slot="title" style="margin: 0; font-size: 64px; line-height: 1.05; font-weight: 600; letter-spacing: -0.035em">Instale o Standcast na sua organização</h1>
<span data-slot="path" class="mono" style="font-size: 18px; color: #A1A1AA">docs.standcast.app/pt-BR/admin/install</span>
</div>
</div>
</body>
</html>
