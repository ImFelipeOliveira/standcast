<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitHub Marketplace feature card</title>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="position: relative; width: 965px; height: 482px; overflow: hidden; background: #3B4BC8; color: #FFFFFF; font-family: Inter, system-ui, sans-serif">
<svg aria-hidden="true" width="965" height="482" style="position: absolute; inset: 0">
<defs>
<pattern id="fc-dot" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="4" y="4" width="4" height="4" fill="#FFFFFF" fill-opacity="0.10"></rect></pattern>
<pattern id="fc-lit" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="10" height="10" rx="1" fill="#FFFFFF" fill-opacity="0.9"></rect></pattern>
<pattern id="fc-mid" width="12" height="12" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="10" height="10" rx="1" fill="#FFFFFF" fill-opacity="0.35"></rect></pattern>
</defs>
<rect width="965" height="482" fill="url(#fc-dot)"></rect>
<rect x="648" y="290" width="60" height="192" fill="url(#fc-mid)"></rect>
<rect x="648" y="338" width="60" height="144" fill="url(#fc-lit)"></rect>
<rect x="732" y="194" width="60" height="288" fill="url(#fc-mid)"></rect>
<rect x="732" y="242" width="60" height="240" fill="url(#fc-lit)"></rect>
<rect x="816" y="98" width="60" height="384" fill="url(#fc-mid)"></rect>
<rect x="816" y="146" width="60" height="336" fill="url(#fc-lit)"></rect>
<rect x="900" y="374" width="24" height="12" fill="url(#fc-mid)"></rect>
<rect x="612" y="422" width="12" height="12" fill="url(#fc-mid)"></rect>
</svg>
<div style="position: absolute; left: 64px; top: 64px; bottom: 64px; width: 520px; display: flex; flex-direction: column; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 12px">
<svg aria-hidden="true" width="32" height="29" viewBox="0 0 44 40"><rect x="0" y="20" width="11" height="20" rx="1.5" fill="#FFFFFF"></rect><rect x="16" y="10" width="11" height="30" rx="1.5" fill="#FFFFFF"></rect><rect x="32" y="0" width="11" height="40" rx="1.5" fill="#FFFFFF"></rect></svg>
<span style="font-family: Saira, Inter, sans-serif; font-weight: 700; font-size: 28px; letter-spacing: -0.01em">Standcast</span>
</span>
<div style="display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 46px; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em">Daily standups, drafted by your AI agent.</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.5; color: #E4E7FB">From GitHub and Linear to one digest per team in Slack or Google Chat.</p>
</div>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; color: #E4E7FB">Open source · MIT · free during the beta</span>
</div>
</div>
</body>
</html>
